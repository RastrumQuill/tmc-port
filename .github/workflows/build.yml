name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a release with this tag (e.g. v0.1.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686 zip

      # No ROM is needed: the executable contains no game data and loads it from
      # the player's ROM at startup.
      - name: Build
        run: make pc-dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: tmc-pc-windows
          path: dist/tmc-pc-windows.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/tmc-pc-windows.zip
          prerelease: true
          generate_release_notes: true
